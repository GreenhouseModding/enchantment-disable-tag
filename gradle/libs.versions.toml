[versions]
minecraft = "1.20.1"
minecraft-parchment = "1.20.1"
parchment = "2023.09.03"

# Xplat
mixin = "0.15.5+mixin.0.8.7"
mixin-extras = "0.3.6"

# Fabric
fabric-loader = "0.16.14"
fabric-api = "0.92.6+1.20.1"
mod-menu = "7.2.2"

# Forge
forge = "1.20.1-47.1.3"

# Gradle
loom = "1.10.+"
moddev = "2.0.116"
mod-publish = "1.1.0"

[libraries]
minecraft = { module = "com.mojang.:minecraft", version.ref = "minecraft" }
parchment = { module = "org.parchmentmc.data:parchment-1.20.1", version.ref = "parchment" }

mixin = { module = "net.fabricmc:sponge-mixin", version.ref = "mixin" }
mixin-extras = { module = "io.github.llamalad7:mixinextras-common", version.ref = "mixin-extras" }
mixin-extras-forge = { module = "io.github.llamalad7:mixinextras-forge", version.ref = "mixin-extras" }

fabric-loader = { module = "net.fabricmc:fabric-loader", version.ref = "fabric-loader" }
fabric-api = { module = "net.fabricmc.fabric-api:fabric-api", version.ref = "fabric-api" }
mod-menu = { module = "com.terraformersmc:modmenu", version.ref = "mod-menu" }

[plugins]
loom = { id = "fabric-loom", version.ref = "loom" }
moddev-legacy = { id = "net.neoforged.moddev.legacyforge", version.ref = "moddev" }
mod-publish = { id = "me.modmuss50.mod-publish-plugin", version.ref = "mod-publish" }
