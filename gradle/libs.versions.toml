# Fabric
fabric-loader = "0.16.14"
fabric-api = "0.116.5+1.21.1"
mod-menu = "11.0.3"

# NeoForge
neoforge = "21.1.173"

# Gradle
loom = "1.11.+"
moddev = "2.0.105"
mod-publish = "1.1.0"

[libraries]
minecraft = { module = "com.mojang.:minecraft", version.ref = "minecraft" }
