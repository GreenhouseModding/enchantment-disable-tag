name: Release Mod

on:
  workflow_dispatch:

concurrency:
  group: "release"
  cancel-in-progress: false

jobs:
  build:
    runs-on: docker

    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: https://code.forgejo.org/actions/checkout@v6

      - name: Set up JDK 17
        uses: https://git.greenhouse.lgbt/Modding/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: https://git.greenhouse.lgbt/Modding/gradle-actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Build with Gradle
        run: ./gradlew build

      - name: Upload Build Files
        uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: build
          path: .
          retention-days: 1
          overwrite: true

  curseforge:
    runs-on: docker
    needs: build

    steps:
      - name: Set up JDK 17
        uses: https://git.greenhouse.lgbt/Modding/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download Build Files
        uses: https://code.forgejo.org/forgejo/download-artifact@v4
        with:
          name: build

      - name: Chmod gradlew
        run: chmod +x ./gradlew

      - name: Publish to CurseForge
        run: ./gradlew publishCurseforge
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}

  modrinth:
    runs-on: docker
    needs: build

    steps:
      - name: Set up JDK 17
        uses: https://git.greenhouse.lgbt/Modding/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download Build Files
        uses: https://code.forgejo.org/forgejo/download-artifact@v4
        with:
          name: build

      - name: Chmod gradlew
        run: chmod +x ./gradlew

      - name: Publish to Modrinth
        run: ./gradlew publishModrinth
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}

  forgejo:
    runs-on: docker
    needs: build

    steps:
      - name: Set up JDK 17
        uses: https://git.greenhouse.lgbt/Modding/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download Build Files
        uses: https://code.forgejo.org/forgejo/download-artifact@v4
        with:
          name: build

      - name: Chmod gradlew
        run: chmod +x ./gradlew

      - name: Publish to Forgejo
        run: ./gradlew publishForgejo
        env:
          FORGEJO_TOKEN: ${{ forge.FORGEJO_TOKEN }}

  maven:
    runs-on: docker
    needs: build

    steps:
      - name: Set up JDK 17
        uses: https://git.greenhouse.lgbt/Modding/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download Build Files
        uses: https://code.forgejo.org/forgejo/download-artifact@v4
        with:
          name: build

      - name: Chmod gradlew
        run: chmod +x ./gradlew

      - name: Publish to Maven
        run: ./gradlew publish
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}