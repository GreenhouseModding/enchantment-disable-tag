modLoader = "javafml"
loaderVersion = "${forge_loader_version_range}"
issueTrackerURL = "${sources}/issues"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}+${minecraft_version}"
displayName = "${mod_name}"
displayURL = "${modrinth_page}"
logoFile = "${mod_id}.png"
logoBlur = false
credits = "${forge_mod_contributors}"
authors = "${mod_author}"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
modId="forge"
mandatory = true
versionRange = "${forge_version_range}"
ordering = "NONE"
side = "SERVER"

[[dependencies.${mod_id}]]
modId="minecraft"
mandatory = true
versionRange = "${forge_minecraft_version_range}"
ordering = "NONE"
side = "SERVER"